# fly launch --config fly.toml  (ou: fly apps create tim-api)
# fly secrets set DATABASE_URL=... CLERK_SECRET_KEY=... ENCRYPTION_SECRET=...
# fly deploy --config fly.toml --dockerfile Dockerfile.api

app = "tim-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile.api"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
